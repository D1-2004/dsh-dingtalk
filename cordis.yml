# dsh-im-dingtalk 组合配置示例
#
# 运行: pnpm dsh --config ./cordis.yml
#
# 环境变量:
#   DINGTALK_CLIENT_ID     - 钉钉应用 Client ID（AppKey）
#   DINGTALK_CLIENT_SECRET - 钉钉应用 Client Secret（AppSecret）
#   DEEPSEEK_API_KEY       - DeepSeek API Key
#   DSH_CWD                - Agent 工作目录（可选）

# ── 核心 spine ──
- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

# ── LLM 适配器 ──
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKey: ${DEEPSEEK_API_KEY}

# ── 执行能力（按需启用） ──
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'

# ── 上下文管理 ──
- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# ── 持久化 ──
- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./.dsh-sessions

# ── 钉钉机器人 IM 驱动 ──
- id: im-dingtalk
  name: '@d1-2004/dsh-dingtalk'
  config:
    clientId: ${DINGTALK_CLIENT_ID}
    clientSecret: ${DINGTALK_CLIENT_SECRET}
    provider: deepseek
    model: deepseek-chat
    cwd: ${DSH_CWD:-/tmp/dsh-dingtalk}
    markdownTitle: AI 助手
    textChunkLimit: 4000
    sessionIdleTimeout: 1800000
    debug: false
